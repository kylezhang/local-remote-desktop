name: Desktop CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_VERSION: '8.0.425'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  PYTHON_VERSION: '3.13'

jobs:
  checks:
    name: Source and packaging checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate workflow
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes=
      - name: Source, localization and installer/package fixtures
        shell: bash
        run: bash scripts/ci/check-source.sh "$RUNNER_TEMP/source-checks"

  windows:
    name: Windows x64
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Prepare pinned FFmpeg test dependency
        shell: pwsh
        run: ./scripts/ci/prepare-windows.ps1 -Directory "$env:RUNNER_TEMP/ffmpeg"
      - name: Build self-contained package and check exact client assembly
        shell: pwsh
        run: ./scripts/ci/windows.ps1 -OutputDirectory "$env:RUNNER_TEMP/windows-artifacts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/windows-artifacts/*.zip
            ${{ runner.temp }}/windows-artifacts/SHA256SUMS.txt
            ${{ runner.temp }}/windows-artifacts/ci.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain fixture reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-reports-${{ github.sha }}
          path: ${{ runner.temp }}/windows-artifacts/reports/
          if-no-files-found: warn
          retention-days: 14

  macos:
    name: macOS Apple Silicon
    needs: checks
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Swift fixtures and unshown native layout checks
        shell: bash
        run: bash scripts/ci/macos.sh "$RUNNER_TEMP/macos-artifacts"
      - name: Compile and package explicit development preview
        shell: bash
        run: bash scripts/package-macos-preview.sh "$RUNNER_TEMP/macos-artifacts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-preview-${{ github.sha }}
          path: |
            ${{ runner.temp }}/macos-artifacts/*.zip
            ${{ runner.temp }}/macos-artifacts/*.dmg
            ${{ runner.temp }}/macos-artifacts/SHA256SUMS.txt
            ${{ runner.temp }}/macos-artifacts/ci.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain fixture reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-reports-${{ github.sha }}
          path: ${{ runner.temp }}/macos-artifacts/reports/
          if-no-files-found: warn
          retention-days: 14
