function modal(){if(!state.dialog)return '';const type=state.dialog,d=devices[state.selected];let fields='',title='',hint='';if(type==='pair'){title=`${t('pairTitle')} ${d.name}`;hint=t('pairHint');fields=`<label for="draft">${t('password')}</label><input id="draft" type="password" autocomplete="off" placeholder="${t('password')}"><label class="check"><input id="remember" type="checkbox" checked> ${t('remember')}</label>`}if(type==='manual'){title=t('manual');hint=t('manualHint');fields=`<label for="draft">${t('address')}</label><input id="draft" type="text" inputmode="decimal" placeholder="192.168.1.24">`}if(type==='edit'){title=t('editTitle');hint=t('editHint');fields=`<label for="draft">${t('newPassword')}</label><input id="draft" type="text" autocomplete="off" placeholder="${t('newPassword')}"><p>${button(t('generate'),'generate','quiet')}</p><p>${t('passwordHint')}</p>`}return `<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h3 id="dialogTitle">${title}</h3><p>${hint}</p>${fields}<div class="error" role="alert">${state.error}</div><div class="buttons">${button(t('back'),'close')}${button(t(type==='edit'?'save':type==='manual'?'next':'pair'),'submit','primary')}</div></section></div>`}
function render(){document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';$('#reviewSubtitle').textContent=t('review');$('#reviewNote').textContent=t('sample');$('#specLink').textContent=state.lang==='zh'?'设计规范':'Design specification';$('#specLink').href=state.lang==='zh'?'../../docs/zh-CN/design.md':'../../docs/design.md';$('#platform').value=state.platform;$('#language').value=state.lang;$('#reviewTabs').innerHTML=['connect','share','session','settings'].map(p=>`<button data-page="${p}" class="${state.page===p?'active':''}">${t(p)}</button>`).join('')+`<span class="caption">${t('preview')}${['windows','mac'].includes(state.platform)?'':' · '+t('desktopMobile')}</span>`;const app=$('#app');app.className=`app ${mobile()?'mobile':''} ${state.fullscreen?'full-preview':''}`;app.dataset.platform=state.platform;app.innerHTML=chrome()+`<div class="app-body">${state.page==='session'?viewer():navigation()+`<div class="content">${state.page==='connect'?connect():state.page==='share'?share():settings()}</div>`}</div>`+(state.page==='session'?'':bottom())+modal();let cases=state.page==='connect'?['normal','first','failed','manualScenario','empty']:state.page==='share'?['normal',...(state.platform==='mac'?['permission','view']:[])]:state.page==='session'?['normal','transferScenario','reconnectScenario']:['normal'];$('#scenarios').innerHTML=`<span>${t('scenario')}</span>`+cases.map(c=>`<button data-scenario="${c}" class="${state.scenario===({transferScenario:'transfer',reconnectScenario:'reconnecting'}[c]||c)?'active':''}">${t(c)}</button>`).join('');if(state.dialog)requestAnimationFrame(()=>$('#draft')?.focus())}
function toast(message){$('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;$('#app').append(el);setTimeout(()=>el.remove(),2800)}
let returnFocus=null;function openDialog(type){returnFocus=document.activeElement;state.dialog=type;state.error='';render()}function closeDialog(){state.dialog=null;state.error='';render();const selector=returnFocus?.dataset.action;requestAnimationFrame(()=>selector?document.querySelector(`[data-action="${selector}"]`)?.focus():$('#reviewTabs button.active')?.focus())}
function toSession(){if(state.sharing){state.dialog=null;render();toast(state.lang==='zh'?'请先停止本机共享，再连接其他设备。':'Stop sharing this device before connecting to another.');return}state.page='session';state.dialog=null;state.options=false;state.scenario='normal';render()}
function action(a){switch(a){case'connect':devices[state.selected].saved?toSession():openDialog('pair');break;case'manual':openDialog('manual');break;case'edit':openDialog('edit');break;case'close':closeDialog();break;case'generate':$('#draft').value='Blueberry482';$('#draft').focus();break;case'submit':{const v=$('#draft').value.trim();if(state.dialog==='manual'){if(!/^(\d{1,3}\.){3}\d{1,3}$/.test(v)||v.split('.').some(n=>+n>255)){state.error=t('ipError');render();break}devices.push({name:t('target')+' '+v,os:t('client'),ip:v,saved:false});state.selected=devices.length-1;openDialog('pair');break}if(state.dialog==='edit'){if(!/^\S{8,64}$/.test(v)){state.error=t('editValidate');render();break}state.password=v;state.sharing=false;closeDialog();toast(t('savedToast'));break}if(v!=='Blueberry482'){state.error=t('wrong');render();break}devices[state.selected].saved=$('#remember').checked;toSession();break}case'refresh':state.scenario='normal';render();break;case'sharing':if(state.scenario==='permission'){toast(t('permHint'));break}state.sharing=!state.sharing;render();break;case'permissions':toast(t('simulation'));break;case'reveal':state.reveal=!state.reveal;render();break;case'copy':toast(t('copied'));break;case'disconnect':state.page='connect';state.scenario='normal';state.options=false;state.keyboard=false;state.fullscreen=false;render();break;case'cancelTransfer':state.scenario='normal';render();toast(t('transferred'));break;case'retry':state.scenario='normal';render();break;case'options':state.options=!state.options;render();break;case'sessionSettings':state.options=false;toast(t('optionsText'));break;case'release':state.options=false;render();toast(t('release'));break;case'fullscreen':state.fullscreen=!state.fullscreen;render();break;case'touch':state.touch=state.touch==='touchpad'?'direct':'touchpad';render();break;case'keyboard':state.keyboard=!state.keyboard;render();break;case'key':toast(t('simulation'));break}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;state.scenario='normal';state.dialog=null;state.options=false;state.fullscreen=false;render()}else if(b.dataset.device!==undefined){state.selected=Number(b.dataset.device);render()}else if(b.dataset.toggle){state.settings[b.dataset.toggle]=!state.settings[b.dataset.toggle];render()}else if(b.dataset.scenario){const c=b.dataset.scenario;state.dialog=null;state.error='';state.scenario={transferScenario:'transfer',reconnectScenario:'reconnecting',manualScenario:'normal'}[c]||c;if(c==='first'||c==='failed'){state.selected=1;state.dialog='pair';state.error=c==='failed'?t('wrong'):''}if(c==='manualScenario')state.dialog='manual';render()}else if(b.dataset.action)action(b.dataset.action)});
document.addEventListener('change',e=>{if(e.target.id==='platform'){state.platform=e.target.value;state.dialog=null;state.scenario='normal';render()}if(['language','appLang'].includes(e.target.id)){state.lang=e.target.value;render()}if(['quality','optionQuality'].includes(e.target.id)){state.quality=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(state.dialog){if(e.key==='Escape'){e.preventDefault();closeDialog()}if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();action('submit')}if(e.key==='Tab'){const els=[...$('.dialog').querySelectorAll('button,input,select')].filter(x=>!x.disabled);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}else if(e.key==='Escape'&&(state.options||state.keyboard||state.fullscreen)){state.options=false;state.keyboard=false;state.fullscreen=false;render()}});
$('#theme').addEventListener('click',()=>{document.body.classList.toggle('dark');$('#theme').setAttribute('aria-pressed',document.body.classList.contains('dark'))});render();
</script>
</body>
</html>
