<svg xmlns="http://www.w3.org/2000/svg" width="240" height="186" viewBox="0 0 240 186">
<title>Accept connections</title>
<desc>The local display stays in front at lower left; the remote display stays behind at upper right. Blue lights the controlled desktop. The connection arrow reverses between roles.</desc>
<defs>
  <linearGradient id="desktop-blue" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#6177F1"/><stop offset=".52" stop-color="#5265EC"/><stop offset="1" stop-color="#3849BD"/>
  </linearGradient>
  <linearGradient id="idle-surface" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#F5F7FC"/><stop offset="1" stop-color="#E4EAF3"/>
  </linearGradient>
  <filter id="case-depth" x="-25%" y="-25%" width="160%" height="180%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#334366" flood-opacity=".12"/>
  </filter>
  <filter id="cursor-depth" x="-40%" y="-30%" width="180%" height="190%">
    <feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#203565" flood-opacity=".18"/>
  </filter>
</defs>
<g filter="url(#case-depth)"><rect x="96" y="18" width="136" height="92" rx="13" fill="#FFFFFF" stroke="#C7D0DE" stroke-width="1.2"/></g>
<rect x="100" y="22" width="128" height="84" rx="9" fill="url(#idle-surface)"/>
<rect x="116" y="38" width="96" height="53" rx="6" fill="#FFFFFF" fill-opacity=".62" stroke="#E5EAF3" stroke-width="1"/>
<path d="M125 49H201" stroke="#DFE5F0" stroke-width="2" stroke-linecap="round"/>
<path d="M112 22.8H216" stroke="#FFFFFF" stroke-opacity=".55" stroke-width=".8" stroke-linecap="round"/>
<g filter="url(#case-depth)"><rect x="14" y="86" width="126" height="86" rx="13" fill="#FFFFFF" stroke="#CBD4EA" stroke-width="1.2"/></g>
<rect x="18" y="90" width="118" height="78" rx="9" fill="url(#desktop-blue)"/>
<rect x="31" y="103" width="92" height="56" rx="6" fill="#FFFFFF" fill-opacity=".96"/>
<path d="M37 113H117" stroke="#E6EAF3" stroke-width="1"/>
<circle cx="38" cy="108.5" r="1.5" fill="#A8B3C9"/><circle cx="43" cy="108.5" r="1.5" fill="#CCD4E3"/>
<rect x="36" y="119" width="16" height="35" rx="3" fill="#EFF2FA"/>
<rect x="40" y="124" width="8" height="2" rx="1" fill="#8B99DC"/><rect x="40" y="130" width="7" height="2" rx="1" fill="#C9D1E5"/>
<rect x="58" y="120" width="58" height="28" rx="3" fill="#F2F4FA"/>
<path d="M61 152H109" stroke="#C7D0E2" stroke-width="2" stroke-linecap="round"/>
<path d="M30 90.8H124" stroke="#FFFFFF" stroke-opacity=".55" stroke-width=".8" stroke-linecap="round"/>
<path d="M230 56C244 87 220 121 190 134C178 139 164 141 149 141m7-6-7 6 7 6" fill="none" stroke="#5265EC" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(96 132) scale(.75)" filter="url(#cursor-depth)">
  <path d="M0 0 21 14 12 15 17 25 12.5 27 7.5 17 1.3 23Z" fill="#FFFFFF" stroke="#253C76" stroke-width="1.1" stroke-linejoin="round"/>
</g>
</svg>