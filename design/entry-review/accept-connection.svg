<svg xmlns="http://www.w3.org/2000/svg" width="200" height="148" viewBox="0 0 200 148">
  <title>Accept connections</title>
  <desc>A local screen in the foreground and a remote screen behind it. A curved arrow shows the connection direction; the pointer marks the controlled screen.</desc>
  <defs>
    <linearGradient id="surface" x1="20" y1="62" x2="120" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0F3FD"/>
    </linearGradient>
    <filter id="depth" x="-25%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#36436A" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect x="87" y="20" width="85" height="55" rx="10" fill="#F0F2F7" stroke="#C8D0DE" stroke-width="1.4"/>
  <rect x="93" y="26" width="73" height="43" rx="5" fill="#F9FAFD"/>
  <g filter="url(#depth)">
    <rect x="20" y="61" width="100" height="64" rx="12" fill="url(#surface)" stroke="#8795E6" stroke-width="1.5"/>
    <path d="M32 66H108" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <path d="M178 47C191 74 163 99 128 99m6-6-6 6 6 6" fill="none" stroke="#5265EC" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(59 79)">
